pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css}"
      run: bun run biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}

    - name: typecheck
      glob: "*.{ts,tsx}"
      run: bun run typecheck

    - name: test
      glob: "*.{js,jsx,ts,tsx}"
      run: bun run test
